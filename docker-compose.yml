services:
  arcade:
    image: ghcr.io/d1same/neteam-friday-arcade:latest
    container_name: neteam-friday-arcade
    ports:
      - "4802:4802"
    volumes:
      - arcade-data:/data
    restart: unless-stopped
    # the server runs as a non-root user and needs no extra privileges
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  arcade-data:
